name: Preteckt
description: >-
  Preteckt provides AI-powered predictive maintenance for transit buses, coach buses, and
  trucking fleets. Its platform ingests vehicle sensor telemetry and applies machine-learning
  algorithms to detect maintenance issues before they cause breakdowns, reducing diagnostic
  time by nearly 50 percent and preventing roughly 20 percent of failures. Preteckt processes
  more than one million sensor data points per day per vehicle across 20+ maintenance-focused
  algorithms. The company is part of Diesel Laptops. It was surfaced as a portfolio company of
  500 Global and added to the API Evangelist network. As of this enrichment pass Preteckt
  publishes no public developer, API, documentation, or sign-up surface.
